# Loopback-only local tunnels support IDEs and private development previews.
# A shell user can already connect to these ports; this is not network isolation.
Match User mylifegraph-matthias
    DisableForwarding no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitOpen 127.0.0.1:* localhost:* [::1]:*
    GatewayPorts no
Match all
