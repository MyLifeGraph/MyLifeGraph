services:
  - type: web
    name: mylifegraph-ai-staging
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: services/ai_service
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: APP_BUILD_SHA="$RENDER_GIT_COMMIT" uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/ready
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_RELEASE_TAG
        value: v0.1.0-pilot.0-rc.0
      - key: APP_MIGRATION_HEAD
        sync: false
      - key: APP_MIGRATION_COUNT
        sync: false
      - key: APP_MIGRATION_IDENTITY_SHA256
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: USE_MOCK_DATA
        value: "false"
      - key: COACH_PROVIDER
        value: disabled
      - key: COACH_BYOK_PROVIDERS
        value: openai,gemini
      - key: SUPABASE_URL
        sync: false
      - key: STAGING_SUPABASE_PROJECT_REF
        value: oscrunlndfrecjilojja
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ACCOUNT_DELETION_JOURNAL_S3_URL
        sync: false
      - key: ACCOUNT_DELETION_JOURNAL_S3_REGION
        sync: false
      - key: ACCOUNT_DELETION_JOURNAL_S3_ACCESS_KEY_ID
        sync: false
      - key: ACCOUNT_DELETION_JOURNAL_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ACCOUNT_DELETION_JOURNAL_S3_KMS_KEY_ARN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
