name: my_life_graph
description: Mobile-first AI-powered personal coach and life graph app foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ">=6.1.5 <7.0.0"
  dio: ^5.7.0
  # Keep the validated file-selector behavior pinned across hosted builds.
  file_selector: 1.0.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: 10.3.1
  flutter_svg: 2.1.0
  go_router: ^14.6.2
  intl: ^0.20.1
  path_provider: ^2.1.5
  phosphor_flutter: 2.1.0
  # 10.1.4 supports the current AGP 8.3 lane; 12.x requires AGP 8.12.1.
  share_plus: ">=10.1.4 <11.0.0"
  shared_preferences: ^2.3.3
  # 2.13+ distinguishes opaque publishable API keys from legacy anon JWTs;
  # 2.15.4 is the repository's validated client version.
  supabase_flutter: 2.15.4
  # Keep the repository's validated timezone behavior pinned.
  timezone: 0.10.1
  # Native hosted Auth renders Cloudflare Turnstile in an isolated WebView.
  webview_flutter: 4.13.0
  # Direct import configures Android third-party cookies required by Turnstile.
  webview_flutter_android: 4.14.0
  # Browser CAPTCHA uses typed DOM/JS interop instead of dart:html.
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/theme/
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
