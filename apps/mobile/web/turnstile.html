<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>MyLifeGraph security check</title>
    <link rel="stylesheet" href="turnstile_challenge.css">
    <script src="turnstile_challenge.js" defer></script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=mylifegraphTurnstileReady&amp;render=explicit"
      defer
    ></script>
  </head>
  <body>
    <main>
      <h1>Human verification</h1>
      <p id="status" role="status" aria-live="polite">
        Loading the security check…
      </p>
      <div id="turnstile-widget" aria-label="Cloudflare Turnstile"></div>
      <button id="cancel" type="button">Cancel</button>
    </main>
  </body>
</html>
