name: Repository verification

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      no_cache:
        description: Run without restoring or saving caches
        type: boolean
        default: false

env:
  CI_NO_CACHE: ${{ inputs.no_cache == true || vars.CI_NO_CACHE == 'true' }}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
      db: ${{ steps.classify.outputs.db }}
      full_e2e: ${{ steps.classify.outputs.full_e2e }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Classify affected paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "web=true"
              echo "db=true"
              echo "full_e2e=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            {
              echo "web=false"
              echo "db=false"
              echo "full_e2e=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=ACMRD "$PR_BASE_SHA...HEAD" \
            | sed '/^$/d' \
            | sort -u \
            | node scripts/verify_affected.mjs --ci \
            >> "$GITHUB_OUTPUT"

  docs-visual:
    name: Docs and visual contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify source, documentation, and visual contracts
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: npm run verify:source

  flutter:
    name: Flutter and Android verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Android dependency downloads only
        if: env.CI_NO_CACHE != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: verify-android-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.java.outputs.version }}-sdk36-build36.0.0-flutter3.44.0-${{ hashFiles('apps/mobile/android/**', 'apps/mobile/pubspec.*', '.github/workflows/ci.yml') }}

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: ${{ env.CI_NO_CACHE != 'true' }}
          pub-cache: false
          cache-key: 'verify-flutter-:os:-:arch:-:version:-:hash:'

      - name: Cache public Flutter packages
        if: env.CI_NO_CACHE != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: verify-pub-v1-${{ runner.os }}-${{ runner.arch }}-flutter3.44.0-${{ hashFiles('apps/mobile/pubspec.*') }}

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter
        working-directory: apps/mobile
        run: flutter analyze --no-pub

      - name: Run all Flutter tests
        working-directory: apps/mobile
        run: flutter test --no-pub

      - name: Run Android JVM tests and lint
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest lintDebug

  backend:
    name: Complete FastAPI test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: ${{ env.CI_NO_CACHE != 'true' && 'pip' || '' }}
          cache-dependency-path: |
            services/ai_service/requirements*.txt
            services/ai_service/pyproject.toml

      - name: Install backend test dependencies
        run: >-
          python -m pip install --require-hashes
          -r services/ai_service/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q services/ai_service/app

      - name: Lint backend
        working-directory: services/ai_service
        run: python -m ruff check app tests

      - name: Run all backend tests
        working-directory: services/ai_service
        run: python -m pytest

  web-build:
    name: Flutter debug web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: ${{ env.CI_NO_CACHE != 'true' }}
          pub-cache: false
          cache-key: 'verify-flutter-:os:-:arch:-:version:-:hash:'

      - name: Cache public Flutter packages
        if: env.CI_NO_CACHE != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: verify-pub-v1-${{ runner.os }}-${{ runner.arch }}-flutter3.44.0-${{ hashFiles('apps/mobile/pubspec.*') }}

      - name: Identify credential-free verification build
        id: web-key
        run: node scripts/web_build_cache.mjs --key >> "$GITHUB_OUTPUT"

      - name: Restore exact verification build
        if: env.CI_NO_CACHE != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .tools/ci-cache/web-debug/${{ steps.web-key.outputs.key }}
          key: verify-web-v1-${{ steps.web-key.outputs.key }}

      - name: Build debug web bundle
        run: npm run verify:web

  database:
    name: Fresh migrations and pgTAP
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Fetch pinned PostgreSQL compatibility images
        run: |
          docker pull public.ecr.aws/supabase/postgres:15.8.1.085
          docker pull public.ecr.aws/supabase/postgres:17.6.1.113

      - name: Apply the fresh migration chain and run all pgTAP assertions
        run: npm run verify:db

  full-e2e:
    name: Full browser E2E
    needs: changes
    if: needs.changes.outputs.full_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ env.CI_NO_CACHE != 'true' && 'npm' || '' }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: ${{ env.CI_NO_CACHE != 'true' && 'pip' || '' }}
          cache-dependency-path: |
            services/ai_service/requirements*.txt
            services/ai_service/pyproject.toml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: ${{ env.CI_NO_CACHE != 'true' }}
          pub-cache: false
          cache-key: 'verify-flutter-:os:-:arch:-:version:-:hash:'

      - name: Cache public Flutter packages
        if: env.CI_NO_CACHE != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: verify-pub-v1-${{ runner.os }}-${{ runner.arch }}-flutter3.44.0-${{ hashFiles('apps/mobile/pubspec.*') }}

      - uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Install browser and backend dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install --require-hashes -r services/ai_service/requirements-dev.txt

      - name: Run the full serial browser regression on a fresh database
        env:
          AI_SERVICE_PYTHON: python
        run: npm run e2e:web:full

      - name: Upload failed run artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
