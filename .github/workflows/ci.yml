name: Repository verification

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
      db: ${{ steps.classify.outputs.db }}
      full_e2e: ${{ steps.classify.outputs.full_e2e }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Classify affected paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "web=false"
              echo "db=false"
              echo "full_e2e=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=ACMRD "$PR_BASE_SHA...HEAD" \
            | sed '/^$/d' \
            | sort -u \
            | node scripts/verify_affected.mjs --ci \
            >> "$GITHUB_OUTPUT"

  docs-visual:
    name: Docs and visual contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify documentation and visual contracts
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run verify:docs
          npm run verify:visual

  flutter:
    name: Flutter and Android verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run all Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Run Android JVM tests and lint
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest lintDebug

  backend:
    name: Complete FastAPI test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai_service/requirements-dev.txt

      - name: Install backend test dependencies
        run: >-
          python -m pip install --require-hashes
          -r services/ai_service/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q services/ai_service/app

      - name: Lint backend
        working-directory: services/ai_service
        run: python -m ruff check app tests

      - name: Run all backend tests
        working-directory: services/ai_service
        run: python -m pytest

  web-build:
    name: Flutter debug web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Build debug web bundle
        run: npm run verify:web

  database:
    name: Fresh migrations and pgTAP
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Apply the fresh migration chain and run all pgTAP assertions
        env:
          RESET_DB: 'true'
        run: npm run verify:db

  full-e2e:
    name: Full browser E2E
    needs: changes
    if: needs.changes.outputs.full_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai_service/requirements-dev.txt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Install browser and backend dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install --require-hashes -r services/ai_service/requirements-dev.txt

      - name: Run the full serial browser regression on a fresh database
        env:
          RESET_DB: 'true'
          AI_SERVICE_PYTHON: python
        run: npm run e2e:web:full

      - name: Upload failed run artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
