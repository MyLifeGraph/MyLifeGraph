name: Staging debug APK

on:
  push:
    branches: [new_backend_gh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build staging debug APK
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Prepare protected staging defines
        env:
          APP_ENV: staging
          USE_MOCK_DATA: "false"
          COACH_SURFACE_ENABLED: "true"
          APP_BUILD_SHA: ${{ github.sha }}
          APP_RELEASE_TAG: v0.1.0-pilot.0-rc.${{ github.run_number }}
          STAGING_SUPABASE_PROJECT_REF: oscrunlndfrecjilojja
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PILOT_CONTACT_EMAIL: ${{ secrets.PILOT_CONTACT_EMAIL }}
          APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          AI_SERVICE_BASE_URL: ${{ secrets.AI_SERVICE_BASE_URL }}
        run: |
          export MLG_DEFINES_FILE="$RUNNER_TEMP/mylifegraph-staging-defines.json"
          node scripts/write_hosted_flutter_defines.mjs "$MLG_DEFINES_FILE"

      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define-from-file="$RUNNER_TEMP/mylifegraph-staging-defines.json"

      - name: Compute artifact identity
        id: artifact
        run: echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyLifeGraph-Staging-Debug-${{ steps.artifact.outputs.commit }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove protected staging defines
        if: always()
        run: rm -f "$RUNNER_TEMP/mylifegraph-staging-defines.json"
