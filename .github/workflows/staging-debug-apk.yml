name: Staging debug APK

on:
  push:
    branches: [new_backend_gh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build staging debug APK
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Prepare protected staging defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_SERVICE_BASE_URL: ${{ secrets.AI_SERVICE_BASE_URL }}
        run: |
          export MLG_DEFINES_FILE="$RUNNER_TEMP/mylifegraph-staging-defines.json"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.env.MLG_DEFINES_FILE, JSON.stringify({APP_ENV:"staging",USE_MOCK_DATA:"false",COACH_SURFACE_ENABLED:"true",SUPABASE_URL:process.env.SUPABASE_URL||"",SUPABASE_ANON_KEY:process.env.SUPABASE_ANON_KEY||"",AI_SERVICE_BASE_URL:process.env.AI_SERVICE_BASE_URL||""}), {mode:0o600})'

      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define-from-file="$RUNNER_TEMP/mylifegraph-staging-defines.json"

      - name: Compute artifact identity
        id: artifact
        run: echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLifeGraph-Staging-Debug-${{ steps.artifact.outputs.commit }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove protected staging defines
        if: always()
        run: rm -f "$RUNNER_TEMP/mylifegraph-staging-defines.json"
